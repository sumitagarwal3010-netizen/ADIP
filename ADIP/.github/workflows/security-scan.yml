name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt || true

  node-deps:
    name: Node dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high || true

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backend SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements backend/requirements.txt -o sbom-backend.json || true
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - name: Frontend SBOM
        run: |
          npm ci
          npx @cyclonedx/cyclonedx-npm --output-file sbom-frontend.json || true
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.json
            sbom-frontend.json
          if-no-files-found: ignore
