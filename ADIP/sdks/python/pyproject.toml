[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adip-sdk"
version = "0.1.0"
description = "Python SDK for the ADIP AI SDLC platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[tool.setuptools.packages.find]
include = ["adip_sdk*"]
