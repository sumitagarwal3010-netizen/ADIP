# Prometheus scrape configuration for ADIP (Role 10 — SRE).
#   docker run -p 9090:9090 -v $PWD/deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Direct scrape (docker-compose / VM). In Kubernetes, use pod annotations
  # (prometheus.io/scrape) already set on the backend Deployment.
  - job_name: "adip-backend"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["adip-backend:8000"]
        labels:
          service: adip-backend

  # Kubernetes pod discovery (uncomment when running in-cluster):
  # - job_name: "adip-k8s"
  #   kubernetes_sd_configs: [{ role: pod }]
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
