# Example secret manifest — DO NOT commit real secrets.
# Create the real secret out-of-band, e.g.:
#   kubectl -n adip create secret generic adip-secrets \
#     --from-literal=database-url='postgresql+psycopg://user:pass@host:5432/adip'
#
# Or use a sealed-secrets / external-secrets operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: adip-secrets
  namespace: adip
type: Opaque
stringData:
  database-url: "postgresql+psycopg://adip:CHANGE_ME@adip-postgres:5432/adip"
