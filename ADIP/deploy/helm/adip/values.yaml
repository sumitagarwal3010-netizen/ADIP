nameOverride: ""
fullnameOverride: ""

backend:
  image:
    repository: adip-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 80
    targetPort: 8000
  env:
    ENVIRONMENT: production
    DEBUG: "false"
    RATE_LIMIT_ENABLED: "true"
    ADIP_AUTH_MODE: oidc
    CONNECTOR_DEFAULT_MOCK: "false"
    CONNECTOR_SYNC_ENABLED: "true"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: adip-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 80
    targetPort: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

ingress:
  enabled: true
  className: nginx
  host: adip.example.com
  tls:
    enabled: false
    secretName: adip-tls

# Database URL is provided via an existing secret (recommended) or set here (dev only).
secrets:
  existingSecret: "adip-secrets"
  databaseUrl: ""

postgresql:
  # Set to true to deploy an in-cluster PostgreSQL (dev/test). For production use
  # a managed database and point secrets.databaseUrl / existingSecret at it.
  enabled: false
